<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7fb">
    <title>구독 관리</title>
    <link rel="stylesheet" href="./css/style.css">
    <script>
      window.module = { exports: {} };
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="page-header">
        <a class="brand" href="./" aria-label="구독 관리 홈">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span>구독 관리</span>
        </a>
        <p class="header-caption">매달 나가는 구독료를 한눈에</p>
      </header>

      <main>
        <section class="summary-section" aria-labelledby="summary-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">OVERVIEW</p>
              <h1 id="summary-title">내 구독 현황</h1>
            </div>
            <span class="today-label" id="today-label"></span>
          </div>

          <div class="summary-grid">
            <article class="summary-card summary-card-primary">
              <span class="summary-label">월 구독료</span>
              <strong class="summary-value" id="monthly-total">₩0</strong>
              <span class="summary-note">월 기준 지출</span>
            </article>
            <article class="summary-card">
              <span class="summary-label">연간 예상 금액</span>
              <strong class="summary-value" id="annual-total">₩0</strong>
              <span class="summary-note">월 구독료 × 12개월</span>
            </article>
            <article class="summary-card">
              <span class="summary-label">이번 주 결제 예정</span>
              <strong class="summary-value" id="upcoming-count">0건</strong>
              <span class="summary-note" id="upcoming-total">결제 예정 금액 ₩0</span>
            </article>
          </div>
        </section>

        <div class="content-grid">
          <section class="panel subscriptions-panel" aria-labelledby="subscriptions-title">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">YOUR SERVICES</p>
                <h2 id="subscriptions-title">구독 목록 <span class="count-badge" id="subscription-count">0</span></h2>
              </div>
              <a class="text-link" href="#subscription-form">+ 구독 추가</a>
            </div>
            <div class="subscription-list" id="subscription-list" aria-live="polite"></div>
          </section>

          <aside class="side-column">
            <section class="panel category-panel" aria-labelledby="category-title">
              <div class="panel-heading">
                <div>
                  <p class="eyebrow">SPENDING</p>
                  <h2 id="category-title">카테고리별 비중</h2>
                </div>
              </div>
              <div class="category-list" id="category-list"></div>
            </section>

            <section class="panel form-panel" id="subscription-form" aria-labelledby="form-title">
              <div class="panel-heading form-heading">
                <div>
                  <p class="eyebrow">ADD A SERVICE</p>
                  <h2 id="form-title">새 구독 추가</h2>
                </div>
              </div>
              <form id="subscription-editor">
                <label class="field">
                  <span>구독 이름</span>
                  <input id="name" name="name" type="text" maxlength="60" placeholder="예: 음악 스트리밍" required>
                </label>
                <div class="field-row">
                  <label class="field">
                    <span>금액</span>
                    <div class="input-with-unit">
                      <input id="amount" name="amount" type="number" min="1" step="1" placeholder="10,900" required>
                      <span>원</span>
                    </div>
                  </label>
                  <label class="field">
                    <span>결제 주기</span>
                    <select id="cycle" name="cycle">
                      <option value="monthly">매월</option>
                      <option value="yearly">매년</option>
                    </select>
                  </label>
                </div>
                <label class="field">
                  <span>다음 결제일</span>
                  <input id="next-payment-date" name="nextPaymentDate" type="date" required>
                </label>
                <label class="field">
                  <span>카테고리</span>
                  <select id="category" name="category">
                    <option value="영상">영상</option>
                    <option value="음악">음악</option>
                    <option value="운동">운동</option>
                    <option value="생산성">생산성</option>
                    <option value="업무">업무</option>
                    <option value="생활">생활</option>
                    <option value="기타">기타</option>
                  </select>
                </label>
                <p class="form-error" id="form-error" role="alert"></p>
                <div class="form-actions">
                  <button class="button button-secondary" id="cancel-edit" type="button" hidden>취소</button>
                  <button class="button button-primary" id="submit-button" type="submit">구독 추가</button>
                </div>
              </form>
            </section>
          </aside>
        </div>
        <p class="app-message" id="app-message" role="status" aria-live="polite"></p>
      </main>
      <footer class="page-footer">내 구독 정보는 이 브라우저에만 저장됩니다.</footer>
    </div>
    <script src="./js/logic.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
